name: October v0.2 source preview release after merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validated-release:
    runs-on: ubuntu-latest
    if: github.repository == 'Cardsmageanime/RetroRelay'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Create combined preview only when source is on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f controllers.py || ! -f CONTROLLER_PREVIEW_NOTES.md ]]; then
            echo 'Controller and artwork update is not merged; no v0.2.0 release.'
            exit 0
          fi
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo 'Controller preview exists; preserving the existing release.'
            exit 0
          fi
          git archive --format=zip --output=RetroRelay_Source_v0.2.0.zip HEAD
          gh release create v0.2.0 RetroRelay_Source_v0.2.0.zip \
            --target "$GITHUB_SHA" \
            --title 'RetroRelay v0.2.0 - Social, Controllers, Artwork & Phone MFA Preview' \
            --notes-file CONTROLLER_PREVIEW_NOTES.md --prerelease
